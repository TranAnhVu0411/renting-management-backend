version: '3.8'

services:
    db:
        image: postgres:18.1-alpine
        restart: unless-stopped
        ports:
            - 5434:${POSTGRES_PORT}
        env_file:
            - .env

    backend:
        image: renting_management
        build: .
        # Let it sleep, we will set it inside docker container
        command: sleep infinity
        volumes:
            - ./project:/project/
        ports:
            - 8100:8100
        depends_on:
            - db