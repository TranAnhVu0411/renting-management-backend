version: '3.8'

services:
    db:
        image: postgres:18.1-alpine
        container_name: db
        restart: unless-stopped
        ports:
            - 5434:${POSTGRES_PORT}
        env_file:
            - .env
        volumes:
            - pg_data:/var/lib/postgresql/data
            # Store running script when initialize db container
            - ./scripts/db:/docker-entrypoint-initdb.d

    backend:
        image: renting_management
        container_name: backend
        build: .
        # Let it sleep, we will set it inside docker container
        command: sleep infinity
        volumes:
            - ./project:/project/
        ports:
            - 8100:8100
        env_file:
            - .env
        depends_on:
            - db

volumes:
    pg_data: